on:
  push:
    branches:
      - main
  pull_request:

name: CI

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      # rust-toolchain.toml overrides dtolnay/rust-toolchain@stable, so in some
      # sense using it is pointless. But it does a few other useful things such
      # as disable incremental compilation, so we use it anyway.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Install just, cargo-hack, and cargo-sync-rdme
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-hack,cargo-sync-rdme
      - name: Lint (clippy)
        run: just powerset clippy --all-targets
      - name: Lint (rustfmt)
        run: cargo xfmt --check
      - name: Run rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: just rustdoc
      # Pin to a specific nightly for compatibility with cargo-sync-rdme.
      - name: Install nightly toolchain for cargo-sync-rdme
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-09-19
      - name: Regenerate readmes
        run: just generate-readmes
      - name: Check for differences
        run: git diff --exit-code

  build-and-test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 1.86 is the MSRV.
        rust-version: ["1.86", "stable"]
      fail-fast: false
    env:
      RUSTFLAGS: -D warnings
      # rust-toolchain.toml overrides the dtolnay/rust-toolchain selection --
      # set this environment variable, which overrides rust-toolchain.toml.
      RUSTUP_TOOLCHAIN: ${{ matrix.rust-version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-version }}
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
        with:
          key: rust-${{ matrix.rust-version }}
      - uses: taiki-e/install-action@cargo-hack
      - uses: taiki-e/install-action@just
      - uses: taiki-e/install-action@nextest
      - name: Build
        run: just powerset build
      # The trybuild fixtures run in the trybuild job below, since they require
      # the pinned toolchain.
      - name: Run tests
        run: just powerset nextest run -E 'not binary(ui_test)'
      - name: Doctests
        run: just powerset test --doc

  trybuild:
    name: Trybuild
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      # rust-toolchain.toml overrides dtolnay/rust-toolchain@stable, so in some
      # sense using it is pointless. But it does a few other useful things such
      # as disable incremental compilation, so we use it anyway.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2.8.0
      - name: Run trybuild tests
        run: cargo test -p integration-tests --test ui_test
