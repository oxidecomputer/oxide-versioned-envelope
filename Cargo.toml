[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(doc_cfg)"] }

[workspace.dependencies]
expectorate = "1.2.0"
hegeltest = "0.46"
oxide-versioned-envelope = { path = "crates/oxide-versioned-envelope" }
schemars08 = { package = "schemars", version = "0.8.22", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_core = "1.0.228"
serde_json = "1.0.151"
static_assertions = "1.1.0"
swrite = "0.1.0"
thiserror = "2.0.18"
